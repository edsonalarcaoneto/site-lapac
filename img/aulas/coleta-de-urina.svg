<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Como coletar urina para exame</title>
  <desc id="d">Ilustração: o jato de urina dividido em três partes, com o primeiro e o último jato descartados e o jato do meio coletado em um frasco estéril com tampa amarela, ao lado de um relógio indicando a entrega ao laboratório em até 1 hora.</desc>
  <defs>
    <pattern id="grade-fina" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E9DFC6" stroke-width="1"/>
    </pattern>
    <pattern id="grade" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grade-fina)"/>
      <path d="M200 0H0V200" fill="none" stroke="#DDCFAD" stroke-width="2"/>
    </pattern>
    <radialGradient id="brilho" cx="62%" cy="55%" r="55%">
      <stop offset="0" stop-color="#FFF4D2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FBF6EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="urina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="1" stop-color="#E2A42A"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="tampa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C94E"/>
      <stop offset="1" stop-color="#D9A422"/>
    </linearGradient>
    <linearGradient id="jato-coletar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="1" stop-color="#E2A42A"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6B5A2E" flood-opacity=".18"/>
    </filter>
    <marker id="ponta" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#C98B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- fundo: papel com a grade da câmara de Neubauer -->
  <rect width="1600" height="900" fill="#FBF6EA"/>
  <rect width="1600" height="900" fill="url(#grade)"/>
  <rect width="1600" height="900" fill="url(#brilho)"/>

  <!-- jato em três partes -->
  <g>
    <rect x="404" y="150" width="56" height="150" rx="28" fill="#C5C8CF"/>
    <rect x="404" y="336" width="56" height="236" rx="28" fill="url(#jato-coletar)"/>
    <rect x="404" y="608" width="56" height="120" rx="28" fill="#C5C8CF"/>
    <!-- gotas -->
    <circle cx="432" cy="760" r="10" fill="#C5C8CF"/>
    <circle cx="432" cy="790" r="6" fill="#C5C8CF"/>

    <!-- selos: descartar / coletar / descartar -->
    <g transform="translate(314 225)">
      <circle r="40" fill="#FFFFFF" stroke="#8C1D2C" stroke-width="5"/>
      <path d="M-14 -14L14 14M14 -14L-14 14" stroke="#8C1D2C" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(314 454)">
      <circle r="46" fill="#2F7A50"/>
      <path d="M-19 1L-6 14L20 -13" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(314 668)">
      <circle r="40" fill="#FFFFFF" stroke="#8C1D2C" stroke-width="5"/>
      <path d="M-14 -14L14 14M14 -14L-14 14" stroke="#8C1D2C" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- seta do jato do meio para o frasco -->
    <path d="M486 454C600 454 650 470 760 500" fill="none" stroke="#C98B12" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18" marker-end="url(#ponta)"/>
  </g>

  <!-- frasco estéril -->
  <g filter="url(#sombra)">
    <!-- corpo -->
    <path d="M820 330L840 735Q842 762 870 762H1130Q1158 762 1160 735L1180 330Z" fill="url(#vidro)" stroke="#A7ABB3" stroke-width="5" stroke-linejoin="round"/>
    <!-- urina -->
    <path d="M829 480L842 734Q844 754 870 754H1130Q1156 754 1158 734L1171 480Z" fill="url(#urina)"/>
    <ellipse cx="1000" cy="480" rx="171" ry="15" fill="#F9E08B"/>
    <!-- reflexo do vidro -->
    <path d="M858 370L872 720" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity=".7"/>
    <!-- marcas de volume -->
    <g stroke="#8E929A" stroke-width="4" stroke-linecap="round">
      <path d="M1138 420H1162"/><path d="M1140 500H1160"/><path d="M1141 580H1159"/><path d="M1143 660H1157"/>
    </g>
    <!-- etiqueta -->
    <g transform="translate(905 560)">
      <rect width="190" height="150" rx="10" fill="#FFFFFF" stroke="#D9DAE0" stroke-width="3"/>
      <text x="95" y="44" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="28" font-weight="700" letter-spacing="5" fill="#8C1D2C">LAPAC</text>
      <rect x="24" y="62" width="142" height="9" rx="4.5" fill="#D6D8DE"/>
      <rect x="24" y="80" width="100" height="9" rx="4.5" fill="#D6D8DE"/>
      <g fill="#2B2730">
        <rect x="24" y="104" width="4" height="30"/><rect x="32" y="104" width="2" height="30"/><rect x="38" y="104" width="6" height="30"/>
        <rect x="48" y="104" width="2" height="30"/><rect x="54" y="104" width="4" height="30"/><rect x="62" y="104" width="2" height="30"/>
        <rect x="68" y="104" width="6" height="30"/><rect x="78" y="104" width="2" height="30"/><rect x="84" y="104" width="4" height="30"/>
        <rect x="92" y="104" width="2" height="30"/><rect x="98" y="104" width="6" height="30"/><rect x="108" y="104" width="2" height="30"/>
        <rect x="114" y="104" width="4" height="30"/><rect x="122" y="104" width="2" height="30"/><rect x="128" y="104" width="6" height="30"/>
        <rect x="138" y="104" width="2" height="30"/><rect x="144" y="104" width="4" height="30"/><rect x="152" y="104" width="2" height="30"/>
        <rect x="158" y="104" width="6" height="30"/>
      </g>
    </g>
    <!-- tampa amarela -->
    <rect x="796" y="262" width="408" height="78" rx="16" fill="url(#tampa)"/>
    <g stroke="#C7921A" stroke-width="5" stroke-linecap="round" opacity=".75">
      <path d="M826 276V326"/><path d="M852 276V326"/><path d="M878 276V326"/><path d="M904 276V326"/><path d="M930 276V326"/>
      <path d="M956 276V326"/><path d="M982 276V326"/><path d="M1008 276V326"/><path d="M1034 276V326"/><path d="M1060 276V326"/>
      <path d="M1086 276V326"/><path d="M1112 276V326"/><path d="M1138 276V326"/><path d="M1164 276V326"/>
    </g>
    <rect x="796" y="262" width="408" height="16" rx="8" fill="#FFFFFF" opacity=".35"/>
  </g>

  <!-- relógio: entregar em até 1 hora -->
  <g transform="translate(1388 360)" filter="url(#sombra)">
    <circle r="104" fill="#FFFFFF" stroke="#2B2730" stroke-width="7"/>
    <g stroke="#2B2730" stroke-width="6" stroke-linecap="round">
      <path d="M0 -84V-70"/><path d="M84 0H70"/><path d="M0 84V70"/><path d="M-84 0H-70"/>
    </g>
    <!-- setor de 1 hora -->
    <path d="M0 0L0 -62A62 62 0 0 1 31 -53.7Z" fill="#F6D365" opacity=".9"/>
    <path d="M0 0V-58" stroke="#2B2730" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0L27 -47" stroke="#8C1D2C" stroke-width="6" stroke-linecap="round"/>
    <circle r="9" fill="#2B2730"/>
  </g>
  <text x="1388" y="560" text-anchor="middle" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#2B2730">até 1 h</text>
  <text x="1388" y="612" text-anchor="middle" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#5A5560">até o laboratório</text>
</svg>
